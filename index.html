<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAZONKA save</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #e1306c;
            letter-spacing: 3px;
        }
        input {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            margin: 20px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            background: #e1306c;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        button:hover {
            background: #c02a5f;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            min-height: 50px;
        }
        .progress {
            width: 100%;
            height: 4px;
            background: #ddd;
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }
        .progress.active {
            display: block;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #e1306c;
            border-radius: 4px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AMAZONKA save</h1>

        <input type="text" id="urlInput" placeholder="Вставь ссылку Instagram...">
        <button id="downloadBtn" onclick="startDownload()">СКАЧАТЬ</button>

        <div class="progress" id="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <p id="status"></p>
    </div>

    <script>
        const status = document.getElementById('status');
        const input = document.getElementById('urlInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        let isDownloading = false;

        // АВТО-ПЕРЕХВАТ ИЗ БУФЕРА
        setInterval(async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text.includes('instagram.com') && text !== input.value) {
                    input.value = text;
                    startDownload(text);
                }
            } catch (e) {}
        }, 1500);

        async function startDownload(givenUrl = null) {
            const url = givenUrl || input.value.trim();
            if (!url || !url.includes('instagram.com')) {
                status.innerHTML = '❌ Неправильная ссылка';
                return;
            }

            if (isDownloading) return;
            isDownloading = true;
            downloadBtn.disabled = true;
            downloadBtn.textContent = '⏳ ЗАГРУЗКА...';

            status.innerHTML = '🔄 Получаем файл через прокси...';
            progress.classList.add('active');
            progressFill.style.width = '0%';

            try {
                // Имитация прогресса
                let prog = 0;
                const interval = setInterval(() => {
                    prog += Math.random() * 10;
                    if (prog > 90) prog = 90;
                    progressFill.style.width = prog + '%';
                }, 200);

                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                clearInterval(interval);

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    throw new Error(errorData.error || 'Ошибка сервера');
                }

                // Получаем файл
                const blob = await res.blob();
                progressFill.style.width = '100%';

                // Определяем расширение
                const contentType = res.headers.get('content-type') || '';
                let ext = '.mp4';
                if (contentType.includes('image/jpeg')) ext = '.jpg';
                else if (contentType.includes('image/png')) ext = '.png';
                else if (contentType.includes('image/gif')) ext = '.gif';
                else if (contentType.includes('image/webp')) ext = '.webp';

                const filename = `instagram_${Date.now()}${ext}`;

                // СКАЧИВАЕМ ФАЙЛ
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 10000);

                status.innerHTML = '✅ Файл скачан!';
                setTimeout(() => {
                    progress.classList.remove('active');
                    progressFill.style.width = '0%';
                }, 2000);

            } catch (e) {
                status.innerHTML = '❌ Ошибка: ' + e.message;
                progress.classList.remove('active');
                progressFill.style.width = '0%';
            } finally {
                isDownloading = false;
                downloadBtn.disabled = false;
                downloadBtn.textContent = 'СКАЧАТЬ';
            }
        }
    </script>
</body>
</html>
