<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAZONKA save</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #e1306c;
            letter-spacing: 3px;
        }
        input {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            margin: 20px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            background: #e1306c;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        button:hover {
            background: #c02a5f;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            min-height: 50px;
        }
        .media-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .media-item {
            background: #f8f8f8;
            border-radius: 12px;
            overflow: hidden;
            padding: 10px;
        }
        .media-item img,
        .media-item video {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .download-btn:hover {
            background: #218838;
        }
        .hidden {
            display: none;
        }
        .progress {
            width: 100%;
            height: 4px;
            background: #ddd;
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }
        .progress.active {
            display: block;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #e1306c;
            border-radius: 4px;
            transition: width 0.3s;
        }
        @media (max-width: 600px) {
            .media-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AMAZONKA save</h1>
        <p>Вставь ссылку Instagram — все фото и видео появятся ниже</p>

        <input type="text" id="urlInput" placeholder="https://www.instagram.com/p/...">
        <button id="downloadBtn" onclick="processLink()">ПОКАЗАТЬ МЕДИА</button>

        <div class="progress" id="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <p id="status"></p>
        <div id="mediaGrid" class="media-grid"></div>
    </div>

    <script>
        const status = document.getElementById('status');
        const input = document.getElementById('urlInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const mediaGrid = document.getElementById('mediaGrid');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        let isProcessing = false;

        // АВТО-ПЕРЕХВАТ ИЗ БУФЕРА
        setInterval(async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text.includes('instagram.com') && text !== input.value) {
                    input.value = text;
                    processLink(text);
                }
            } catch (e) {}
        }, 1500);

        async function processLink(givenUrl = null) {
            const url = givenUrl || input.value.trim();
            if (!url || !url.includes('instagram.com')) {
                status.innerHTML = '❌ Неправильная ссылка';
                return;
            }

            if (isProcessing) return;
            isProcessing = true;
            downloadBtn.disabled = true;
            downloadBtn.textContent = '⏳ ЗАГРУЗКА...';
            mediaGrid.innerHTML = '';

            status.innerHTML = '🔄 Получаем медиа...';
            progress.classList.add('active');
            progressFill.style.width = '0%';

            try {
                let prog = 0;
                const interval = setInterval(() => {
                    prog += Math.random() * 10;
                    if (prog > 90) prog = 90;
                    progressFill.style.width = prog + '%';
                }, 200);

                const res = await fetch('/api/media', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                clearInterval(interval);

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    throw new Error(errorData.error || 'Ошибка сервера');
                }

                const data = await res.json();
                progressFill.style.width = '100%';

                if (!data.media || data.media.length === 0) {
                    status.innerHTML = '❌ Медиа не найдены';
                    return;
                }

                // ОТОБРАЖАЕМ ВСЕ МЕДИА
                data.media.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'media-item';

                    if (item.type === 'video') {
                        div.innerHTML = `
                            <video controls>
                                <source src="${item.url}" type="video/mp4">
                            </video>
                            <button class="download-btn" onclick="downloadMedia('${item.url}', 'video_${index}.mp4')">
                                ⬇ Скачать видео
                            </button>
                        `;
                    } else {
                        div.innerHTML = `
                            <img src="${item.url}" alt="Фото ${index + 1}">
                            <button class="download-btn" onclick="downloadMedia('${item.url}', 'photo_${index}.jpg')">
                                ⬇ Скачать фото
                            </button>
                        `;
                    }

                    mediaGrid.appendChild(div);
                });

                status.innerHTML = `✅ Найдено ${data.media.length} файлов! Нажмите "Скачать" под каждым.`;

                setTimeout(() => {
                    progress.classList.remove('active');
                    progressFill.style.width = '0%';
                }, 1000);

            } catch (e) {
                status.innerHTML = '❌ Ошибка: ' + e.message;
                progress.classList.remove('active');
                progressFill.style.width = '0%';
            } finally {
                isProcessing = false;
                downloadBtn.disabled = false;
                downloadBtn.textContent = 'ПОКАЗАТЬ МЕДИА';
            }
        }

        // ФУНКЦИЯ СКАЧИВАНИЯ ОТДЕЛЬНОГО ФАЙЛА
        function downloadMedia(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
